<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الجدول الجامعي</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📚 محلل الجدول الجامعي</h1>
            <p class="subtitle">جامعة الإمام محمد بن سعود الإسلامية</p>
        </div>

        <!-- Data Status -->
        <div id="statusBar" class="status-bar">
            <div id="statusMessage">جارٍ تحميل البيانات...</div>
            <button id="refreshBtn" class="btn-refresh" title="تحديث البيانات">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                </svg>
            </button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section" id="filterSection" style="display: none;">
            <label class="label">تصفية الشعب:</label>
            <div class="filter-input-group">
                <input type="text" id="filterInput" class="input-field" placeholder="أدخل CRN أو رمز المادة...">
                <button id="filterBtn" class="btn-primary">تصفية</button>
            </div>
        </div>

        <!-- Results Table -->
        <div id="resultsContainer" style="display: none;">
            <div class="table-header">
                <h2 id="tableTitle">قائمة الشعب</h2>
                <span id="countBadge" class="badge">0</span>
            </div>

            <div class="table-wrapper">
                <table class="courses-table">
                    <thead>
                        <tr>
                            <th class="col-select">✓</th>
                            <th>الرمز</th>
                            <th>اسم المادة</th>
                            <th>CRN</th>
                            <th>النوع</th>
                            <th>الدكتور</th>
                            <th>الموعد</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- Data will be inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Build Schedule Button -->
            <button id="buildScheduleBtn" class="btn-build-schedule">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                عرض الجدول والتحقق من التعارض
            </button>
        </div>

        <!-- Schedule Section -->
        <div id="scheduleSection" style="display: none;">
            <!-- Status Alert -->
            <div id="conflictAlert" class="alert"></div>

            <!-- Schedule Grid -->
            <div class="schedule-container">
                <div class="schedule-grid" id="scheduleGrid">
                    <!-- Time Column -->
                    <div class="time-col">
                        <div class="time-header"></div>
                        <div class="time-slot">08:00</div>
                        <div class="time-slot">09:00</div>
                        <div class="time-slot">10:00</div>
                        <div class="time-slot">11:00</div>
                        <div class="time-slot">12:00</div>
                        <div class="time-slot">01:00</div>
                        <div class="time-slot">02:00</div>
                        <div class="time-slot">03:00</div>
                        <div class="time-slot">04:00</div>
                        <div class="time-slot">05:00</div>
                    </div>

                    <!-- Days Columns -->
                    <div class="day-col" id="day-1">
                        <div class="day-header">الأحد</div>
                    </div>
                    <div class="day-col" id="day-2">
                        <div class="day-header">الاثنين</div>
                    </div>
                    <div class="day-col" id="day-3">
                        <div class="day-header">الثلاثاء</div>
                    </div>
                    <div class="day-col" id="day-4">
                        <div class="day-header">الأربعاء</div>
                    </div>
                    <div class="day-col" id="day-5">
                        <div class="day-header">الخميس</div>
                    </div>
                    <div class="day-col" id="day-6">
                        <div class="day-header weekend">الجمعة</div>
                    </div>
                    <div class="day-col" id="day-7">
                        <div class="day-header weekend">السبت</div>
                    </div>
                </div>
            </div>

            <!-- Success Summary -->
            <div id="successSummary" style="display: none;">
                <h3 class="summary-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    ملخص المواد المعتمدة
                </h3>
                <div id="summaryGrid" class="summary-grid">
                    <!-- Summary cards will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Custom Tooltip -->
        <div id="customTooltip" class="tooltip"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
